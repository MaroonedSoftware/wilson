# Pinned, not taken from the folder name. Compose names a project after the directory it runs in,
# and the containers below belong to project `kanban`, this folder's original name. Without this,
# renaming the folder to `wilson` makes `docker compose up` a different project: it collides on
# `container_name: wilson-db`, and removing the old container to get past that would start `db` on
# a new, empty volume, because `db` keeps the board in the anonymous volume the postgres image
# declares rather than a named one. Change this only together with moving that data.
name: kanban

services:
    db:
        image: postgres:17
        restart: always
        container_name: wilson-db
        ports:
            - '15532:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: wilson
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'wilson']
            interval: 5s
            timeout: 5s
            start_period: 10s
            retries: 5

    # Nightly `pg_dump -Fc` of `db` only — card 0262, decision 1: Postgres is the system of
    # record for the board, and durability (backups, point-in-time recovery) is its problem, not
    # a second copy this stack was otherwise never keeping. `db-test` is tmpfs by design and is
    # deliberately not dumped here. Same image as `db` so the dump and server versions cannot
    # drift. Dumps land on the host, outside the repo and outside this container, at
    # `WILSON_BACKUP_DIR` (default `../.wilson-backups` relative to this file) — see PROJECT.md's
    # Deployment section for the schedule, retention and restore command. `wilson doctor`'s
    # "database backed up" check reads that same directory.
    backup:
        image: postgres:17
        restart: always
        container_name: wilson-backup
        depends_on:
            db:
                condition: service_healthy
        environment:
            PGHOST: db
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: wilson
        volumes:
            - ${WILSON_BACKUP_DIR:-../.wilson-backups}:/backups
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
                set -eu
                while true; do
                    if [ "$$(date +%H:%M)" = "03:00" ]; then
                        stamp="$$(date +%F)"
                        target="/backups/wilson-$${stamp}.dump"
                        if [ ! -f "$$target" ]; then
                            tmp="$${target}.tmp"
                            pg_dump -Fc -f "$$tmp"
                            mv "$$tmp" "$$target"
                            find /backups -maxdepth 1 -name 'wilson-*.dump' -mtime +14 -delete
                        fi
                    fi
                    sleep 30
                done

    # Dedicated Postgres for the test suite. Data lives in tmpfs and durability is
    # off — DO NOT point anything you care about at this.
    db-test:
        image: postgres:17
        restart: always
        container_name: wilson-test-db
        ports:
            - '15533:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: wilson_test
        command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'wilson_test']
            interval: 5s
            timeout: 5s
            start_period: 10s
            retries: 5
