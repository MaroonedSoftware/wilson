<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="wilson-favicon-t">
  <title id="wilson-favicon-t">Wilson</title>
  <!--
    A favicon has no surrounding text color for `currentColor` to inherit (brand/wilson-mark.svg's
    own fill), so this bakes light/dark directly into the SVG with a media query instead — the
    browser tab itself has no other way to know which chrome it's sitting in.

    Uses wilson-mark-16.svg's hinted geometry, not the primary mark's: a favicon renders at 16-32px,
    squarely the range brand/README.md reserves the hinted variant for.
  -->
  <style>
    .wilson-favicon-fill { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .wilson-favicon-fill { fill: #f5f5f5; }
    }
  </style>
  <mask id="wilson-favicon-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <rect width="100" height="100" fill="black"/>
    <g fill="white">
      <rect x="17" y="28" width="18" height="24" rx="9"/>
      <rect x="38" y="21" width="18" height="31" rx="9"/>
      <rect x="59" y="25" width="18" height="27" rx="9"/>
      <path d="M10 40 h80 a10 10 0 0 1 10 10 v7 a40 40 0 0 1 -40 40 h-20 a40 40 0 0 1 -40 -40 v-7 a10 10 0 0 1 10 -10 z"/>
    </g>
    <g fill="none" stroke="black" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 62 l4 4 l8 -10"/>
      <path d="M61 62 l4 4 l8 -10"/>
      <path d="M36 80 q14 9 28 0"/>
    </g>
  </mask>
  <rect width="100" height="100" class="wilson-favicon-fill" mask="url(#wilson-favicon-mask)"/>
</svg>
