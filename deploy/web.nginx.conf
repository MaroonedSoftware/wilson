# The web app: static files, with every unknown path answered by index.html so the router's own
# routes (/projects/wilson/cards/0001, say) load on a refresh or a pasted link. /api goes to the API,
# so the board is one origin on one port.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Workers hold a WebSocket here, the feed and chat are event streams, and a merge answers only
    # after the suite has run, so nothing is buffered and nothing idle is cut off.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        client_max_body_size 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must not be cached, or a rebuilt image keeps serving the old bundle names.
    #
    # frame-src stops an operator app's iframe navigating itself away, which its own document's policy
    # cannot, and would otherwise carry data out in the URL. The app itself still loads, since srcdoc is
    # not fetched. Every page route lands here through try_files, so this is the one place to set it.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-src 'none'";
    }
}
