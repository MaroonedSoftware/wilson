# The web app: static files, with every unknown path answered by index.html so the router's own
# routes (/projects/wilson/cards/0001, say) load on a refresh or a pasted link.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must not be cached, or a rebuilt image keeps serving the old bundle names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
