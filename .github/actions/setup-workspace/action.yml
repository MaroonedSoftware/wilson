name: Set up the workspace
description: pnpm, the Node version the Dockerfile builds with, and the locked dependencies.

runs:
    using: composite
    steps:
        # pnpm comes from this action rather than corepack: Node 25 and later no longer ship a
        # corepack binary. The version still comes from the repo's `packageManager`.
        - name: Install pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

        - name: Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version: 26
              cache: pnpm

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
