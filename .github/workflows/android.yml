name: Android

# Pull requests reach this through `pr.yml`, which decides whether it is needed and counts it in `ci-ok`.
on:
    push:
        branches: [main]
        paths:
            - apps/android/**
            - apps/api/data/contracts/**
            - packages/sdk-kotlin/**
            - .github/workflows/android.yml
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/android
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            # bundleRelease is here for R8, which breaks without a source change and fails on a phone.
            - run: ./gradlew :sdk:build :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
