name: Android

# Pull requests reach this through `pr.yml`, which decides whether it is needed and counts it in `ci-ok`.
on:
    push:
        branches: [main]
        paths:
            - apps/android/**
            - apps/api/data/contracts/**
            - packages/sdk-kotlin/**
            - .github/workflows/android.yml
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/android
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
            # bundleRelease is here for R8, which breaks without a source change and fails on a phone.
            - run: ./gradlew :sdk:build :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
