name: Android

# Pull requests reach this through `pr.yml`, which decides whether it is needed and counts it in `ci-ok`.
on:
    push:
        branches: [main]
        paths:
            - apps/android/**
            - apps/api/data/contracts/**
            - packages/sdk-kotlin/**
            - .github/workflows/android.yml
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/android
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            # bundleRelease is here for R8, which breaks without a source change and fails on a phone.
            - run: ./gradlew :sdk:build :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
