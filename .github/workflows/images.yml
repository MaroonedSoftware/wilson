name: Images

# The single-container images (Dockerfile, targets `full` and `slim`) that unraid/wilson.xml installs.
# amd64 only: that is what an Unraid server runs. Nothing publishes until the checks pass on this commit:
# they passed on each pull request, but a ruleset that does not require an up-to-date branch means
# never on the two of them together.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# One at a time, so an older commit cannot finish last and leave the moving tags on itself. A run waiting
# here gives way to a newer one. Not cancelled once started: that could leave one variant published without the other.
concurrency:
    group: images
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/maroonedsoftware/wilson

jobs:
    check:
        uses: ./.github/workflows/build.yml

    image:
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        strategy:
            # One variant failing should not hide the state of the other.
            fail-fast: false
            matrix:
                include:
                    - variant: full
                      tags: full,latest
                    - variant: slim
                      tags: slim
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Work out the tags
              id: tags
              run: |
                  {
                      echo 'list<<EOF'
                      for tag in ${MATRIX_TAGS//,/ }; do echo "$IMAGE:$tag"; done
                      echo "$IMAGE:$MATRIX_VARIANT-$GITHUB_SHA"
                      echo EOF
                  } >> "$GITHUB_OUTPUT"
              env:
                  MATRIX_TAGS: ${{ matrix.tags }}
                  MATRIX_VARIANT: ${{ matrix.variant }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: ${{ matrix.variant }}
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.tags.outputs.list }}
                  cache-from: type=gha,scope=${{ matrix.variant }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
