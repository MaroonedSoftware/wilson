name: Pull Request

on:
    pull_request:

permissions:
    contents: read

# A new push to the branch makes the run for the old one worthless.
concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml

    # Proves the image builds and boots, on the runner alone: a pull request publishes nothing and is
    # given no registry credentials. `full` is built on `slim`, so this one target covers both builds,
    # and it needs no database of its own to start.
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  cleanup: false

            - name: Build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: full
                  platforms: linux/amd64
                  push: false
                  load: true
                  tags: wilson:ci
                  # Reads what the last `Images` run on main left.
                  cache-from: type=gha,scope=full

            - name: It boots and serves
              run: deploy/smoke.image.sh wilson:ci

    # The one check a ruleset on main should require. Job names inside a called workflow come out as
    # `build / build` and `build / test`, and that list will grow; requiring this instead means the
    # ruleset never goes stale.
    #
    # `always()`, because a job whose need failed is skipped rather than failed, and a skipped
    # required check reads as a pass.
    ci-ok:
        needs: [build, image]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Every job passed
              env:
                  BUILD: ${{ needs.build.result }}
                  IMAGE: ${{ needs.image.result }}
              run: |
                  echo "build=$BUILD image=$IMAGE"
                  if [ "$BUILD" != success ]; then
                      echo "::error::The build ended $BUILD."
                      exit 1
                  fi
                  if [ "$IMAGE" != success ]; then
                      echo "::error::The image build ended $IMAGE."
                      exit 1
                  fi
