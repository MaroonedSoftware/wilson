name: Desktop

# Pull requests reach this through `pr.yml`, which decides whether it is needed and counts it in `ci-ok`.
on:
    push:
        branches: [main]
        paths:
            - apps/desktop/**
            - apps/android/app/src/test/resources/api/**
            - apps/api/data/contracts/**
            - packages/sdk-csharp/**
            - .github/workflows/desktop.yml
    workflow_call:

permissions:
    contents: read

jobs:
    # Ubuntu while nothing here needs a Mac: a macOS minute costs about ten of these.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: apps/desktop
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  global-json-file: apps/desktop/global.json
            # Two copies of one number: changesets bumps the first and the app is stamped from the second.
            - name: The version agrees
              run: |
                  manifest="$(node -p "require('./package.json').version")"
                  props="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)"
                  echo "package.json ${manifest}, Directory.Build.props ${props}"
                  test "$manifest" = "$props"
            - run: dotnet restore Wilson.Desktop.slnx --locked-mode
            - run: dotnet build Wilson.Desktop.slnx -warnaserror --no-restore
            - run: dotnet test --solution Wilson.Desktop.slnx --no-build

    # Output that does not compile is a generator bug to find here rather than in the app. Whether the
    # SDK matches the contracts is the `generated` job's to check, in `build.yml`.
    sdk:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: 10.0.x
            - run: dotnet build packages/sdk-csharp/WilsonSdk.csproj -warnaserror
