name: Build

# The whole check, called by `pr.yml`. Two jobs side by side: `build` compiles and lints, `test` runs
# the suites against a throwaway Postgres.
on:
    workflow_call:

# The build reads the repo and nothing else.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Don't leave the token in .git/config for the install and build steps.
                  persist-credentials: false

            # pnpm comes from this action rather than corepack: Node 25 and later no longer ship a
            # corepack binary. The version still comes from the repo's `packageManager`.
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            # The version the Dockerfile builds with.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # A warning, not a gate, until the tree has been formatted once.
            - name: Check formatting
              run: pnpm format:check || echo "::warning title=Formatting::Prettier found unformatted files (listed in this step's log). Run pnpm format to fix them."

            # `lint:check`, never `lint`: that one is `eslint --fix`.
            - name: Lint
              run: pnpm lint:check

            - name: Build
              run: pnpm build

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # The `db-test` service from docker-compose.yml, on the same port and credentials, so the
        # defaults in `apps/api/tests/support/test.db.ts` find it without any TEST_DATABASE_* overrides.
        services:
            postgres:
                image: postgres:17
                ports:
                    - 15533:5432
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: wilson_test
                options: >-
                    --health-cmd "pg_isready -U postgres -d wilson_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test
