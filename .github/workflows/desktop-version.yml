# The desktop app's version pull request. Each changeset reaching main opens it, or rewrites it from
# main's tip, and merging it is the release: see `apps/desktop/CLAUDE.md`, under Releasing. Not
# `changesets/action`, because all this needs of it is a branch, a commit and one `gh` call.

name: Desktop version

on:
    push:
        branches: [main]
        paths:
            - .changeset/*.md
    workflow_dispatch:

permissions:
    # The branch, the pull request, and starting `pr.yml` on it.
    contents: write
    pull-requests: write
    actions: write

concurrency: desktop-version

env:
    BRANCH: changeset-release/desktop

jobs:
    version:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # The install runs other people's code, and this token can write. Only the last step gets it.
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup-workspace

            - name: Apply the changesets
              run: pnpm release:version

            # A changeset made with --empty bumps nothing, and is consumed by the next real one.
            - name: Is there a new version
              id: bumped
              run: |
                  if git diff --quiet -- apps/desktop/package.json; then
                      echo "::notice::No pending changeset bumps the desktop app."
                      echo "value=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "value=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open the pull request
              if: steps.bumped.outputs.value == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  version="$(node -p "require('./apps/desktop/package.json').version")"
                  title="Release Wilson desktop ${version}"
                  gh auth setup-git
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git checkout -B "$BRANCH"
                  git add -A .changeset apps/desktop
                  git commit -m "$title"
                  git push --force origin "$BRANCH"

                  body="Merging this publishes Wilson desktop ${version}, and installed copies offer it within six hours. Nobody looks at it after that, and the tests do not cover the screens, so walk the app first. See apps/desktop/CHANGELOG.md in this diff."
                  if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
                      gh pr edit "$BRANCH" --title "$title" --body "$body"
                  else
                      gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
                  fi

                  # GitHub starts nothing for what this token does, and main requires `ci-ok`.
                  gh workflow run pr.yml --ref "$BRANCH"
